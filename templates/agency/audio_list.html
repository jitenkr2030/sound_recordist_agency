{% extends "base.html" %}{% block content %}<div class="d-flex justify-content-between"><h1>Audio library & delivery</h1><a class="btn btn-accent" href="{% url 'audio_upload' %}">Upload audio</a></div><div class="panel p-3 table-responsive mt-3"><table class="table table-dark"><thead><tr><th>Title</th><th>Project</th><th>Version</th><th>Client visible</th><th>Approved</th><th>File</th></tr></thead><tbody>{% for a in objects %}<tr><td>{{a.title}}</td><td>{{a.project}}</td><td>{{a.version}}</td><td>{{a.is_client_visible}}</td><td>{{a.approved}}</td><td><a href="{{a.file.url}}">Download</a></td></tr>{% empty %}<tr><td colspan="6">No audio files uploaded.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
